<body class="bg-light-background text-light-on-background dark:bg-dark-background dark:text-dark-on-background font-body antialiased">
  <div class="min-h-[1024px] flex flex-col justify-between p-2xl" data-stitch-vh="min-h-[1024px]===min-h-screen">
    <header class="w-full max-w-xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-md">
        <div class="w-9 h-9 rounded bg-light-primary dark:bg-dark-primary text-light-on-primary dark:text-dark-on-primary flex items-center justify-center">
          <span class="material-symbols-outlined text-[20px]" style="font-variation-settings: &#39;FILL&#39; 1;">workspaces</span>
        </div>
        <span class="font-headline text-headline-md" data-design-text-token="headline-md">FreelanceHub</span>
      </div>
      <button type="button" onclick="toggleTheme()" aria-label="Toggle theme" class="w-10 h-10 rounded bg-light-surface dark:bg-dark-surface border border-light-border dark:border-dark-border flex items-center justify-center text-light-on-surface-subtle dark:text-dark-on-surface-subtle">
        <span class="material-symbols-outlined text-[20px]">contrast</span>
      </button>
    </header>

    <main class="w-full max-w-xl mx-auto my-xl">
      <div class="bg-light-surface dark:bg-dark-surface border border-light-border dark:border-dark-border rounded-md p-2xl shadow-sm flex flex-col gap-lg">
        <div>
          <h1 class="font-headline text-headline-lg" data-design-text-token="headline-lg">Create account</h1>
          <p class="font-body text-body-md text-light-on-surface-subtle dark:text-dark-on-surface-subtle mt-xs" data-design-text-token="body-md">Set up your independent freelance workspace in seconds.</p>
        </div>

        <form onsubmit="return false;" class="flex flex-col gap-md">
          <div class="grid grid-cols-2 gap-md">
            <label class="flex flex-col gap-xs">
              <span class="font-label text-label-md" data-design-text-token="label-md">Full name</span>
              <input type="text" placeholder="Alex Morgan" class="w-full min-h-[44px] px-md py-sm rounded bg-light-surface dark:bg-dark-background border border-light-border dark:border-dark-border text-body-md">
            </label>
            <label class="flex flex-col gap-xs">
              <span class="font-label text-label-md" data-design-text-token="label-md">Default currency</span>
              <select class="w-full min-h-[44px] px-md py-sm rounded bg-light-surface dark:bg-dark-background border border-light-border dark:border-dark-border text-body-md">
                <option>USD ($)</option>
                <option>GBP (£)</option>
                <option>EUR (€)</option>
              </select>
            </label>
          </div>
          <label class="flex flex-col gap-xs">
            <span class="font-label text-label-md" data-design-text-token="label-md">Email address</span>
            <input type="email" placeholder="alex@freelancehub.io" class="w-full min-h-[44px] px-md py-sm rounded bg-light-surface dark:bg-dark-background border border-light-border dark:border-dark-border text-body-md">
          </label>
          <label class="flex flex-col gap-xs">
            <span class="font-label text-label-md" data-design-text-token="label-md">Password</span>
            <input type="password" placeholder="At least 8 characters" class="w-full min-h-[44px] px-md py-sm rounded bg-light-surface dark:bg-dark-background border border-light-border dark:border-dark-border text-body-md">
          </label>
          <label class="flex items-center gap-sm min-h-10">
            <input type="checkbox" checked class="w-4 h-4 rounded-sm border-light-border dark:border-dark-border text-light-primary dark:text-dark-on-primary-container">
            <span class="font-body text-body-sm text-light-on-surface-subtle dark:text-dark-on-surface-subtle" data-design-text-token="body-sm">I agree to the Terms of Service and Privacy Policy</span>
          </label>
          <button type="submit" class="w-full min-h-[44px] rounded bg-light-primary text-light-on-primary dark:bg-dark-primary dark:text-dark-on-primary font-label text-label-lg" data-design-text-token="label-lg">Create FreelanceHub Account</button>
        </form>
      </div>
      <p class="text-center font-body text-body-md text-light-on-surface-subtle dark:text-dark-on-surface-subtle mt-lg" data-design-text-token="body-md">
        Already have an account?
        <a href="../auth-login-tablet/AuthLoginTablet.html" class="font-label text-label-lg text-light-primary dark:text-dark-on-primary-container hover:underline ml-xs" data-design-text-token="label-lg">Sign in</a>
      </p>
    </main>

    <footer class="text-center">
      <span class="font-body text-body-sm text-light-on-surface-subtle dark:text-dark-on-surface-subtle" data-design-text-token="body-sm">Your freelance business, organized.</span>
    </footer>
  </div>
  <script>
    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      try { localStorage.setItem('fh-theme', isDark ? 'dark' : 'light'); } catch (e) {}
    }
    (function initTheme() {
      try { if (localStorage.getItem('fh-theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}
    })();
  </script>


</body></html>
