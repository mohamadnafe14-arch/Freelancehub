<body class="bg-light-background text-light-on-background dark:bg-dark-background dark:text-dark-on-background font-body antialiased">
  <div class="min-h-[884px] flex flex-col justify-between px-lg py-xl" data-stitch-vh="min-h-[884px]===min-h-screen">
    <!-- Top Bar -->
    <header class="w-full max-w-md mx-auto flex items-center justify-between gap-sm">
      <div class="flex items-center gap-sm">
        <div class="w-8 h-8 rounded bg-light-primary dark:bg-dark-primary text-light-on-primary dark:text-dark-on-primary flex items-center justify-center">
          <span class="material-symbols-outlined text-[18px]" style="font-variation-settings: &#39;FILL&#39; 1;">workspaces</span>
        </div>
        <span class="font-headline text-headline-md" data-design-text-token="headline-md">FreelanceHub</span>
      </div>
      <button type="button" onclick="toggleTheme()" aria-label="Toggle light or dark theme" class="inline-flex items-center justify-center w-10 h-10 rounded bg-light-surface text-light-on-surface-subtle border border-light-border dark:bg-dark-surface dark:text-dark-on-surface-subtle dark:border-dark-border hover:bg-light-surface-subtle dark:hover:bg-dark-surface-subtle">
        <span class="material-symbols-outlined text-[20px]">contrast</span>
      </button>
    </header>

    <!-- Registration Card -->
    <main class="w-full max-w-md mx-auto my-lg">
      <div class="bg-light-surface dark:bg-dark-surface border border-light-border dark:border-dark-border rounded-md p-xl shadow-sm flex flex-col gap-lg">
        <div>
          <h1 class="font-headline text-headline-lg" data-design-text-token="headline-lg">Create your account</h1>
          <p class="font-body text-body-md text-light-on-surface-subtle dark:text-dark-on-surface-subtle mt-xs" data-design-text-token="body-md">Start organizing your clients, projects, and income.</p>
        </div>

        <form onsubmit="return false" class="flex flex-col gap-md">
          <label data-component-id="input-field-text" data-component-type="input-field" data-component-variant="text" class="flex flex-col gap-xs">
            <span class="font-label text-label-md" data-design-text-token="label-md">Full name</span>
            <input type="text" placeholder="Alex Morgan" autocomplete="name" required class="w-full min-h-[44px] px-md py-sm rounded bg-light-surface text-light-on-surface border border-light-border dark:bg-dark-background dark:text-dark-on-surface dark:border-dark-border placeholder:text-light-on-surface-subtle dark:placeholder:text-dark-on-surface-subtle focus:border-light-primary dark:focus:border-dark-primary focus:ring-1 focus:ring-light-primary dark:focus:ring-dark-primary focus:outline-none text-body-md">
          </label>

          <label data-component-id="input-field-text" data-component-type="input-field" data-component-variant="text" class="flex flex-col gap-xs">
            <span class="font-label text-label-md" data-design-text-token="label-md">Email address</span>
            <input type="email" placeholder="alex@domain.com" autocomplete="email" required class="w-full min-h-[44px] px-md py-sm rounded bg-light-surface text-light-on-surface border border-light-border dark:bg-dark-background dark:text-dark-on-surface dark:border-dark-border placeholder:text-light-on-surface-subtle dark:placeholder:text-dark-on-surface-subtle focus:border-light-primary dark:focus:border-dark-primary focus:ring-1 focus:ring-light-primary dark:focus:ring-dark-primary focus:outline-none text-body-md">
          </label>

          <div class="flex flex-col gap-xs">
            <label for="reg-password" class="font-label text-label-md" data-design-text-token="label-md">Password</label>
            <div class="relative flex items-center">
              <input id="reg-password" type="password" placeholder="At least 8 characters" autocomplete="new-password" required class="w-full min-h-[44px] pl-md pr-2xl py-sm rounded bg-light-surface text-light-on-surface border border-light-border dark:bg-dark-background dark:text-dark-on-surface dark:border-dark-border placeholder:text-light-on-surface-subtle dark:placeholder:text-dark-on-surface-subtle focus:border-light-primary dark:focus:border-dark-primary focus:ring-1 focus:ring-light-primary dark:focus:ring-dark-primary focus:outline-none text-body-md">
              <button type="button" onclick="togglePassword(&#39;reg-password&#39;, this)" aria-label="Show password" class="absolute right-sm w-8 h-8 rounded flex items-center justify-center text-light-on-surface-subtle dark:text-dark-on-surface-subtle">
                <span class="material-symbols-outlined text-[18px]">visibility</span>
              </button>
            </div>
            <!-- Password Strength Bar -->
            <div class="grid grid-cols-4 gap-xs pt-xs" aria-hidden="true">
              <div class="h-1 rounded-full bg-light-primary dark:bg-dark-primary"></div>
              <div class="h-1 rounded-full bg-light-primary dark:bg-dark-primary"></div>
              <div class="h-1 rounded-full bg-light-primary dark:bg-dark-primary"></div>
              <div class="h-1 rounded-full bg-light-border dark:bg-dark-border"></div>
            </div>
            <span class="font-body text-body-sm text-light-on-surface-subtle dark:text-dark-on-surface-subtle" data-design-text-token="body-sm">Use 8+ characters with a number and symbol.</span>
          </div>

          <label class="flex items-start gap-sm py-xs cursor-pointer">
            <input type="checkbox" required class="mt-xs w-4 h-4 rounded-sm border-light-border dark:border-dark-border text-light-primary dark:text-dark-on-primary-container focus:ring-light-primary dark:focus:ring-dark-primary shrink-0">
            <span class="font-body text-body-sm text-light-on-surface-subtle dark:text-dark-on-surface-subtle" data-design-text-token="body-sm">I agree to the Terms of Service and Privacy Policy.</span>
          </label>

          <a href="../auth-verify-email/AuthVerifyEmail.html" data-component-id="button-primary" data-component-type="button" data-component-variant="primary" class="w-full inline-flex items-center justify-center gap-sm px-lg py-sm min-h-[44px] rounded bg-light-primary text-light-on-primary dark:bg-dark-primary dark:text-dark-on-primary hover:opacity-95 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-light-primary dark:focus-visible:ring-dark-primary transition-colors duration-state-change">
            <span class="font-label text-label-lg" data-design-text-token="label-lg">Create account</span>
          </a>
        </form>
      </div>

      <p class="text-center font-body text-body-md text-light-on-surface-subtle dark:text-dark-on-surface-subtle mt-lg" data-design-text-token="body-md">
        Already have an account?
        <a href="../auth-login/AuthLogin.html" class="font-label text-label-lg text-light-primary dark:text-dark-on-primary-container hover:underline ml-xs" data-design-text-token="label-lg">Sign in</a>
      </p>
    </main>

    <footer class="text-center">
      <span class="font-body text-body-sm text-light-on-surface-subtle dark:text-dark-on-surface-subtle" data-design-text-token="body-sm">Your freelance business, organized.</span>
    </footer>
  </div>

  <script>
    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      try { localStorage.setItem('fh-theme', isDark ? 'dark' : 'light'); } catch (e) {}
    }
    (function initTheme() {
      try { if (localStorage.getItem('fh-theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}
    })();
    function togglePassword(id, btn) {
      const input = document.getElementById(id);
      const icon = btn.querySelector('.material-symbols-outlined');
      if (input.type === 'password') {
        input.type = 'text';
        icon.textContent = 'visibility_off';
        btn.setAttribute('aria-label', 'Hide password');
      } else {
        input.type = 'password';
        icon.textContent = 'visibility';
        btn.setAttribute('aria-label', 'Show password');
      }
    }
  </script>


</body></html>
